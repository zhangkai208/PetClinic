server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: pet-health-system
  security:
    user:
      name: zk
      password: 123456

  mail:
    host: smtp.qq.com
    port: 587
    username: 2834969129@qq.com
    password:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/petclinic?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password:

  ai:
    openai:
      base-url: https://ark.cn-beijing.volces.com/api/v3
      api-key:
      chat:
        completions-path: /chat/completions
        options:
          model: deepseek-v3-2-251201
      embedding:
        enabled: false  # 禁用自动配置，使用自定义的硅基流动 EmbeddingModel

    mcp:
      client:
        stdio:
          servers-configuration: classpath:mcp-servers.json

    vectorstore:
      redis:
        index-name: petclinic-vectors   # 正确的属性名是 index-name
        prefix: "doc:"                   # 存入 Redis 的 key 前缀
        initialize-schema: true          # 启动时自动帮你建索引结构

  data:
    redis:
      # ⚠️ 注意：如果你在本地跑代码，这里填服务器公网IP；如果你打包部署到服务器，这里填 localhost
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      client-type: jedis   # 使用 Jedis 客户端（Spring AI Redis VectorStore 需要）
      jedis:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

app:
  mail:
    reminder:
      enabled: true
      sender-name: 宠物健康管理员

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zk.petclinic.domain
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.zk.petclinic: debug
    org.springframework.web: info
    org.springframework.ai.chat.client.advisor: debug

# 硅基流动 Embedding API 配置
siliconflow:
  api-key:
